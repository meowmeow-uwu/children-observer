[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

include = ["configs*", "module_*", "scripts*"]

[project]
name = "children-observer"
version = "0.1.0"
description = "AI Child Guardian: Hệ thống Giám sát & Bảo vệ Trẻ em Chủ động"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.19.1",
    "pyjwt>=2.13.0",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "aiomqtt>=2.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pytest-mock>=3.15.1",
]

# Phân tách dependency: backend chỉ cài nhóm cốt lõi (FastAPI/DB/relay).
# Edge (AI/WebRTC/video) cài qua `uv sync --extra edge` — không tải
# Torch/Ultralytics/ONNX nặng nề lên backend container.
[project.optional-dependencies]
edge = [
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "lap>=0.5.12",
    "torch>=2.4",
    "torchvision>=0.19",
    "onnxruntime>=1.19",
    "aiortc>=1.14.0",
    "av>=16.1.0",
    "psutil>=5.9",
    "albumentations>=1.4",
]
# MediaPipe has no Linux aarch64 wheel.  The production `demo_stream`
# entrypoint uses ONNX + ByteTrack and does not import it; retain it only for
# the older multi-task/pose pipeline on supported development platforms.
edge-legacy-pose = ["mediapipe>=0.10"]
gpu = ["onnxruntime-gpu>=1.19"]
tensorrt = ["tensorrt>=10.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.3.0",
    "httpx2>=2.10.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: long-running end-to-end pipeline tests (chạy riêng với -m integration)",
]
addopts = "-m 'not integration'"

[tool.uv.sources]
# CPU build của PyTorch — demo Edge chỉ cần ByteTrack chạy CPU (ONNX là engine
# thật). Bản cu128 nặng ~9GB (image edge 13.4GB, .venv 4.2GB) gây tốn ổ C
# và build rất lâu. Training nếu cần GPU vẫn có thể đổi index cu128 lại.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

