[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

include = ["configs*", "module_*", "scripts*"]

[project]
name = "children-observer"
version = "0.1.0"
description = "AI Child Guardian: Hệ thống Giám sát & Bảo vệ Trẻ em Chủ động"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "torch>=2.4",
    "torchvision>=0.19",
    "albumentations>=1.4",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "numpy>=1.26",
    "pillow>=10.4",
    "onnxruntime>=1.19",
    "psutil>=5.9",
    "cryptography>=43.0",
    "python-dotenv>=1.0",
    "mediapipe>=0.10",
    "aiortc>=1.14.0",
    "av>=16.1.0",
    "opencv-python>=4.13.0.92",
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.19.1",
    "pyjwt>=2.13.0",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "aiomqtt>=2.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.19"]
tensorrt = ["tensorrt>=10.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

