version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: guardian_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: child_guardian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d child_guardian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: guardian_fastapi
    restart: always
    ports:
      - "8007:8000"
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword123@db:5432/child_guardian_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: guardian_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: guardian_edge
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data: