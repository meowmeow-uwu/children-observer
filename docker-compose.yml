services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: guardian_mqtt
    restart: "no"
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data

  db:
    image: postgres:15-alpine
    container_name: guardian_postgres
    restart: "no"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: child_guardian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d child_guardian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["sh", "-c", "cd /app/module_backend_infra && uv run alembic upgrade head"]
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword123@db:5432/child_guardian_db
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["sh", "-c", "cd /app/module_backend_infra && uv run python seed_demo.py"]
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword123@db:5432/child_guardian_db
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - SEED_PUBLISH_MQTT=true
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: guardian_fastapi
    restart: "no"
    ports:
      - "8007:8000"
    volumes:
      - snapshot_data:/app/module_backend_infra/data/snapshots
    environment:
      - DATABASE_URL=postgresql://admin:secretpassword123@db:5432/child_guardian_db
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    depends_on:
      mqtt:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: guardian_frontend
    restart: "no"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    container_name: guardian_edge
    restart: "no"
    environment:
      - EDGE_CAMERA_ID=camera_living_room_01
      - EDGE_BACKEND_URL=http://backend:8000
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - EDGE_MQTT_ENABLED=true
      - EDGE_REST_SYNC_ENABLED=false
      - EDGE_VIEWER_GATED=false
      - EDGE_VIDEO_PATH=/app/module_edge_firmware/test_video.mp4
      - EDGE_MODEL_PATH=/app/weights/roi_detection/best.onnx
      - EDGE_ONNX_INTRA_THREADS=8
      - EDGE_ALERT_COOLDOWN_SECONDS=5
    depends_on:
      backend:
        condition: service_healthy
      mqtt:
        condition: service_started
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  mqtt_data:
  snapshot_data:
