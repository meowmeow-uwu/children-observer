services:
  db:
    image: postgres:15-alpine
    container_name: guardian_postgres
    restart: "no"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: child_guardian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d child_guardian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: guardian_fastapi
    restart: "no"
    ports:
      - "8007:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
